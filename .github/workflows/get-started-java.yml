name: Build and test Java Get Started sample

on:
  push:
    branches:
      - main
      - regen/clients-**
    paths:
      - 'get-started/azure-auth/java/**'
      - 'get-started/quickstart/java/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'get-started/azure-auth/java/**'
      - 'get-started/quickstart/java/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-azure:

    defaults:
      run:
        working-directory: get-started/azure-auth/java/

    runs-on: ubuntu-latest
    needs: []

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 17
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
    - run: ./gradlew build

  build-quickstart:

    defaults:
      run:
        working-directory: get-started/quickstart/java/

    runs-on: ubuntu-latest
    needs: []

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 17
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
    - run: ./gradlew build
