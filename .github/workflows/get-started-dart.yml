name: Build and test Dart Get Started sample

on:
  push:
    branches:
      - main
      - regen/clients-**
    paths:
      - 'get-started/quickstart/dart/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'get-started/quickstart/dart/**'
      - '.github/workflows/**'

jobs:
  build-quickstart-dart:
    runs-on: ubuntu-latest

    permissions:
      checks: write

    name: 'Static Analysis'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub

      - name: Install dependencies
        run: dart pub get
        working-directory: get-started/quickstart/dart

      - name: Analyze project source
        if: always()
        run: dart analyze --fatal-infos
        working-directory: get-started/quickstart/dart

      - name: Compile
        if: always()
        run: dart compile exe ./bin/cli.dart
        working-directory: get-started/quickstart/dart
