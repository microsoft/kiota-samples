name: Build and test Go Get Started sample

on:
  push:
    branches:
      - main
      - regen/clients-**
    paths:
      - "get-started/azure-auth/go/**"
      - "get-started/quickstart/go/**"
  pull_request:
    branches: [main]
    paths:
      - "get-started/azure-auth/go/**"
      - "get-started/quickstart/go/**"

jobs:
  build-azure:
    defaults:
      run:
        working-directory: get-started/azure-auth/go/

    runs-on: ubuntu-latest
    needs: []

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "^1.24"

      - name: Build Azure auth
        run: go build -v ./...

  build-quickstart:
    defaults:
      run:
        working-directory: get-started/quickstart/go/

    runs-on: ubuntu-latest
    needs: []

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "^1.24"

      - name: Build quickstart
        run: go build -v ./...
